<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShiftWise Mine View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#e8eef7;
  --ink:#0a2540; --muted:#5b6b82; --faint:#8a98ad; --line:rgba(10,37,64,.09);
  --accent:#4f5bff; --accent-soft:rgba(79,91,255,.1); --blue:#2f5bea;
  --ok:#1f9d6b; --ok-soft:#e1f5ec; --warn:#c77d0a; --warn-soft:#fdf0d9; --bad:#d6383d; --bad-soft:#fde6e6;
  --off:#8a96a8; --off-soft:#eef1f5;
  --glass:rgba(255,255,255,.62);
  --shadow:0 1px 2px rgba(10,37,64,.06),0 10px 30px rgba(10,37,64,.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--sky);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;outline:none}
#labels{position:fixed;inset:0;pointer-events:none}
button{font:inherit;color:inherit}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border-radius:16px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.7)}

/* Brand */
.brand{position:fixed;left:16px;top:16px;width:400px;padding:12px 16px;z-index:5}
.brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand h1 i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:inline-block;position:relative}
.brand h1 i:after{content:"";position:absolute;inset:6px 5px;border:2px solid #fff;border-top:none;border-right:none;transform:rotate(-45deg) translate(1px,-2px)}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.health{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:11.5px;color:var(--muted);cursor:default}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
.dot.ok{background:var(--ok)} .dot.warn{background:#e9a23b} .dot.bad{background:var(--bad)} .dot.off{background:var(--off)}

/* Metric tiles */
.tiles{position:fixed;left:432px;right:16px;top:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;z-index:5}
.tile{display:flex;gap:12px;align-items:center;padding:12px 14px}
.tile .ic{width:42px;height:42px;border-radius:12px;background:linear-gradient(180deg,#eef1ff,#e1e6ff);display:grid;place-items:center;flex:none}
.tile .ic svg{width:22px;height:22px}
.tile .ml{font-size:12px;color:var(--muted);line-height:1.3}
.tile .mv{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.tile .mv small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.tile .ms{font-size:11.5px;color:var(--muted)}
.mv.ok{color:var(--ok)} .mv.warn{color:var(--warn)} .mv.bad{color:var(--bad)}

/* Queue */
.queue{position:fixed;left:16px;top:142px;bottom:16px;width:400px;overflow:auto;z-index:4}
.qhead{padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:baseline}
.qhead h2{margin:0;font-size:15px;font-weight:700}
.qhead span{font-size:12px;color:var(--muted)}
.qrow{width:100%;text-align:left;border:none;background:none;display:grid;grid-template-columns:26px 1fr 92px;gap:10px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;align-items:start}
.qrow:hover,.qrow.sel{background:rgba(255,255,255,.55)}
.qrow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.qn{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;display:grid;place-items:center;margin-top:1px}
.qrow.done .qn{background:var(--ok-soft);color:var(--ok)}
.qt{font-weight:600;font-size:13.5px;line-height:1.35}
.qrow.done .qt{color:var(--muted)}
.qs{font-size:12.5px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qm{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:rgba(10,37,64,.06);color:var(--muted);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.qi{text-align:right}
.qi b{display:block;font-size:13px}
.qi span{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.qi em{display:block;font-style:normal;font-size:12px;color:var(--accent);margin-top:6px;font-weight:600}
.qi.pos b{color:var(--ok)} .qi.track b{color:var(--accent)} .qi.warn b{color:var(--warn)} .qi.dim b{color:var(--muted)}

/* Nav buttons */
.nav{position:fixed;right:408px;top:142px;display:flex;flex-direction:column;padding:4px;gap:2px;z-index:5;border-radius:14px}
.nav button{width:38px;height:38px;border:none;background:none;border-radius:10px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.nav button:hover{background:rgba(255,255,255,.8)}
.nav button.on{color:var(--accent)}
.nav button svg{width:18px;height:18px}
.nav hr{border:none;border-top:1px solid var(--line);margin:2px 6px}

/* Side panel */
.side{position:fixed;right:16px;top:142px;bottom:16px;width:380px;z-index:5;display:flex;flex-direction:column;overflow:hidden}
.sbody{flex:1;overflow:auto;padding:14px 16px}
.sfoot{padding:12px 16px 16px;border-top:1px solid var(--line);display:none;gap:8px}
.sfoot.show{display:grid}
.seg{display:flex;background:rgba(10,37,64,.06);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:none;background:none;padding:6px 6px;border-radius:8px;font-size:12.5px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(10,37,64,.12)}
.ahead{display:flex;gap:12px;align-items:center;margin:14px 0 10px}
.ahead .ic{width:48px;height:48px;border-radius:12px;background:linear-gradient(180deg,#eef1ff,#dfe5ff);display:grid;place-items:center;flex:none}
.ahead .ic svg{width:26px;height:26px}
.kick{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--blue);text-transform:uppercase}
.ahead h3{margin:1px 0 0;font-size:17px;letter-spacing:-.01em}
.ahead .sub{font-size:12.5px;color:var(--muted)}
.astat{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.off{background:var(--off-soft);color:var(--muted)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:rgba(255,255,255,.6);border-radius:12px;padding:10px 12px}
.stat .sl{font-size:11.5px;color:var(--muted);line-height:1.3}
.stat .sv{font-size:17px;font-weight:700;margin-top:2px}
.stat .sv small{font-size:12px;color:var(--muted);font-weight:500}
.bar{height:4px;border-radius:4px;background:rgba(10,37,64,.08);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.bar i.ok{background:var(--ok)} .bar i.warn{background:#e9a23b} .bar i.bad{background:var(--bad)}
.ltabs{display:flex;gap:4px;margin:16px 0 6px;border-bottom:1px solid var(--line)}
.ltabs button{border:none;background:none;padding:8px 10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.ltabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.ltabs button span{font-weight:500;color:var(--faint);margin-left:3px}
.lrow{width:100%;border:none;background:none;display:grid;grid-template-columns:10px 1fr auto 14px;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left}
.lrow:hover{background:rgba(255,255,255,.55)}
.lrow b{font-size:13px;font-weight:600;display:block}
.lrow span.s{font-size:12px;color:var(--muted)}
.lrow .chev{color:var(--faint)}
.back{border:none;background:none;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:2px 0}
.dkind{font-size:12px;color:var(--muted);margin-top:10px}
.dtitle{margin:3px 0 8px;font-size:17px;line-height:1.3;letter-spacing:-.01em}
.sbody p{margin:0 0 12px}
.sec{margin:16px 0 0}
.sec h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600}
.checks{display:grid;gap:6px;font-size:13px}
.check{display:grid;grid-template-columns:20px 84px 1fr;gap:6px;align-items:start}
.check i{font-style:normal;font-weight:700;text-align:center}
.check.ok i{color:var(--ok)} .check.warn i{color:var(--warn)} .check.bad i{color:var(--bad)}
.check span{color:var(--muted)}
.ev{display:grid;gap:8px}
.evr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px;padding:8px 10px;background:rgba(255,255,255,.6);border-radius:10px}
.evr b{font-weight:600} .evr span{color:var(--muted);font-size:12px;grid-column:1/-1} .evr em{font-style:normal;font-size:11.5px;color:var(--ok);font-weight:600;text-align:right}
.alts{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:13px}
.alts li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.alts li span{color:var(--muted);text-align:right}
.big{display:flex;align-items:baseline;gap:8px;margin:2px 0 12px}
.big b{font-size:26px;letter-spacing:-.02em;white-space:nowrap}
.big span{color:var(--muted);font-size:13px}
.linkbtn{border:1px solid rgba(79,91,255,.3);background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px;cursor:pointer;width:100%;text-align:left}
.linkbtn:hover{background:rgba(79,91,255,.16)}
.btns{display:flex;gap:8px}
.btn{flex:1;border-radius:10px;padding:10px 12px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:#fff}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#4049e6}
.btn:disabled{opacity:.45;cursor:not-allowed}
.reason{display:none;gap:8px}
.reason.show{display:grid}
.reason select,.reason textarea{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;color:var(--ink);background:#fff}
.reason textarea{resize:vertical;min-height:54px}
.note{font-size:12px;color:var(--muted);margin:0}

/* Activity cycle tracker */
.cycle{position:fixed;left:432px;right:464px;bottom:16px;z-index:4;padding:12px 16px 14px}
.cyh{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px}
.cyh b{font-size:14px}
.cyh .nx{margin-left:auto;color:var(--muted);font-size:12px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.steps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:relative}
.step{display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;min-width:0}
.step:before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:3px;background:rgba(10,37,64,.1);z-index:0}
.step:first-child:before{display:none}
.step.done:before,.step.now:before,.step.bad:before{background:var(--blue)}
.step i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px;position:relative;z-index:1;background:#fff;border:2px solid rgba(10,37,64,.15);color:var(--faint)}
.step.done i{background:var(--blue);border-color:var(--blue);color:#fff}
.step.now i{background:#fff;border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px rgba(79,91,255,.18)}
.step.bad i{background:var(--bad);border-color:var(--bad);color:#fff;box-shadow:0 0 0 4px rgba(214,56,61,.15)}
.step.warn i{background:#fff;border-color:#e9a23b;color:var(--warn);box-shadow:0 0 0 4px rgba(233,162,59,.18)}
.step b{font-size:11.5px;margin-top:5px;font-weight:600;white-space:nowrap}
.step span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* Labels, tooltip, toast */
.lbl{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.94);border-radius:999px;padding:2px 9px 2px 7px;font:600 11px/1.5 Inter,system-ui,sans-serif;color:var(--ink);box-shadow:0 1px 3px rgba(10,37,64,.18);white-space:nowrap;transform:translateY(-14px)}
.lbl .dot{margin:0;width:7px;height:7px}
.lbl.lvl{background:rgba(10,37,64,.78);color:#fff;cursor:default;pointer-events:none;letter-spacing:.02em}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 10px;border-radius:8px;z-index:9;opacity:0;transition:opacity .12s;max-width:260px}
#tip b{display:block;font-size:12.5px}
#toast{position:fixed;left:50%;top:150px;transform:translate(-50%,-10px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:all .25s;z-index:10;max-width:min(520px,calc(100% - 32px));text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;z-index:1}
.mseg{display:none}

@media (max-width:1280px){
  .tile .ic{display:none}
  .cycle .nx{display:none}
}
@media (max-width:1100px){ .cycle{display:none} }
@media (max-width:900px){
  .brand{left:8px;right:8px;top:8px;width:auto;padding:10px 12px}
  .tiles{left:8px;right:8px;top:112px;grid-template-columns:1fr 1fr;gap:6px}
  .tile{padding:8px 10px}
  .tile .ml{font-size:11px}
  .tile .mv{font-size:18px}
  .tile .ms{display:none}
  .mseg{display:flex;position:fixed;left:8px;right:60px;top:278px;z-index:5;overflow-x:auto}
  .nav{right:8px;top:278px}
  .queue{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:32%}
  .side{display:none;left:8px;right:8px;top:auto;bottom:8px;width:auto;height:72%;z-index:7}
  .side.detail{display:flex}
  .side .areaonly{display:none}
}
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<div id="loading">Loading the mine model</div>

<header class="brand glass">
  <h1 id="brandTitle"><i></i>ShiftWise <span style="font-weight:500;color:var(--muted)">Mine view</span></h1>
  <p>KTO underground · Day shift · 13:07 · Week 39</p>
  <div class="health" aria-label="System and data health">
    <span title="Fleet management: live"><i class="dot ok"></i>Fleet</span>
    <span title="SCADA: live"><i class="dot ok"></i>SCADA</span>
    <span title="SAP work orders: last sync 12:45"><i class="dot ok"></i>SAP 12:45</span>
    <span title="Radio updates: last one 3 min ago"><i class="dot ok"></i>Radio 3 min</span>
    <span title="Underground network: partial coverage"><i class="dot warn"></i>Network partial</span>
  </div>
</header>

<div class="tiles" id="metrics"></div>

<aside class="queue glass" aria-label="Next best actions">
  <div class="qhead"><h2>Next best actions</h2><span id="qcount"></span></div>
  <div id="qlist"></div>
</aside>

<div class="nav glass" role="toolbar" aria-label="Camera">
  <button id="zIn" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button id="zOut" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
  <hr>
  <button id="rL" title="Rotate left (Q)" aria-label="Rotate left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
  <button id="rR" title="Rotate right (E)" aria-label="Rotate right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
  <button id="home" title="Whole mine" aria-label="Whole mine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></button>
  <hr>
  <button id="lblBtn" class="on" title="Show labels" aria-label="Show labels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg></button>
</div>

<div class="seg mseg glass" id="mseg"></div>

<aside class="side glass" id="side">
  <div class="sbody" id="sbody"></div>
  <div class="sfoot" id="sfoot"></div>
</aside>

<div class="cycle glass" id="cycle"></div>

<div id="tip"></div>
<div id="toast"></div>

<script type="importmap">

const COL={ok:0x1f9d6b,warn:0xe9a23b,bad:0xd6383d,off:0x8a96a8,accent:0x4f5bff};
const mat=(color,o={})=>new THREE.MeshStandardMaterial({color,roughness:.7,metalness:.05,...o});
function mesh(geo,m,cast=true){const x=new THREE.Mesh(geo,m);x.castShadow=cast;x.receiveShadow=true;return x;}

function makeLabel(text,cls,st){const el=document.createElement('div');el.className='lbl '+(cls||'');el.innerHTML=(st?`<i class="dot ${st}"></i>`:'')+text;return el;}
const shortName=id=>INFO[id].name.replace(/^(Truck|Loader|Primary fan|Stope|Heading|Pump station|Charge-up unit|Water-jet unit|Jumbo|Sprayer|Light vehicle) /,'');
function addLabel(root,id,y){
  const el=makeLabel(shortName(id),'',INFO[id].st);
  el.addEventListener('click',e=>{e.stopPropagation();openDetail(id,true);});
  const o=new CSS2DObject(el);o.position.set(0,y,0);root.add(o);

}
function addStatusRing(root,st,r){
  if(st!=='bad'&&st!=='warn')return;
  const ring=new THREE.Mesh(new THREE.RingGeometry(r*.84,r,48),new THREE.MeshBasicMaterial({color:COL[st],transparent:true,opacity:.5,side:THREE.DoubleSide,depthWrite:false}));
  ring.rotation.x=-Math.PI/2;ring.position.y=.07;ring.renderOrder=2;root.add(ring);pulses.push(ring);root.userData.ring=ring;
}
function addPin(root,y,st){
  const g=new THREE.Group(), m=mat(COL[st],{emissive:COL[st],emissiveIntensity:.25});
  const head=mesh(new THREE.SphereGeometry(.55,20,14),m); head.position.y=.9; g.add(head);
  const tip=mesh(new THREE.ConeGeometry(.42,.9,20),m); tip.rotation.x=Math.PI; tip.position.y=.3; g.add(tip);
  g.add(at(mesh(new THREE.SphereGeometry(.22,12,10),mat(0xffffff)),0,.95,.42));
  g.position.y=y; root.add(g); pins.push({g,base:y,ph:rnd()*6}); root.userData.pin=g;
}
function register(id,root,level,layer,labelY=2){
  root.userData.id=id; pickables.push(root);
  assets[id]={id,root,level,layer};
  addStatusRing(root,INFO[id].st,root.userData.r||1.6);
  if(INFO[id].st==='bad') addPin(root,labelY+.4,'bad');
  addLabel(root,id,labelY);
  return assets[id];
}
function signTex(text,fg='#2f5bea',bg='#ffffff',w=512,h=112){
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  x.fillStyle=bg;x.fillRect(0,0,w,h);x.fillStyle=fg;x.font='700 50px Inter, system-ui, sans-serif';x.textBaseline='middle';x.fillText(text,26,h/2+2);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t;
}
function strataTex(widthUnits){
  const c=document.createElement('canvas');c.width=256;c.height=512;const x=c.getContext('2d');
  const bands=[[.035,'#8c6a4c'],[.11,'#c69e74'],[.12,'#dcc39f'],[.2,'#bfb3a2'],[.17,'#aaa092'],[.14,'#c7bcab'],[.225,'#9c9286']];
  let y=0; for(const [f,col] of bands){x.fillStyle=col;x.fillRect(0,y,256,f*512+1);y+=f*512;}
  for(let i=0;i<900;i++){x.fillStyle=`rgba(${rnd()<.5?'60,50,40':'255,255,255'},${.05+rnd()*.08})`;x.fillRect(rnd()*256,rnd()*512,1+rnd()*3,1+rnd()*2);}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=THREE.RepeatWrapping;t.repeat.set(widthUnits/34,1);return t;
}

const GROUND=0xe2e8f2, SOIL=0xb39a7c, DEEP=-26;

function block(x0,x1,z0,z1,y0,y1,faces={}){
  const g=new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0);
  const top=mat(GROUND,{roughness:.9}), soil=mat(SOIL,{roughness:1});
  const side=k=>faces[k]?mat(0xffffff,{map:strataTex(faces[k]),roughness:1}):soil;
  const m=new THREE.Mesh(g,[side('px'),side('nx'),top,soil,side('pz'),side('nz')]);
  m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);m.receiveShadow=true;world.add(m);return m;
}

  const color=n.cls==='pos'?'var(--ok)':n.cls==='warn'?'var(--warn)':n.cls==='track'?'var(--accent)':'var(--muted)';
  let h=backBtn()+`<div class="dkind">Action ${i+1} · ${n.area}</div><h3 class="dtitle">${n.title}</h3>`;
  h+=st?`<span class="pill ok">${st==='confirming'?'Field check requested':st==='declined'?'Not now':st==='seen'?'Seen':'Approved'}</span>`:`<span class="pill acc">Confidence ${n.conf}%</span>`;
  h+=`<div class="big" style="margin-top:12px"><b style="color:${color}">${n.lift?'+'+n.lift+' pts':n.big}</b><span>${n.lift?'effect on the chance of completing the plan':n.cap}</span></div>`;
  h+=`<p>${n.why}</p><div class="sec"><h4>Why now</h4><p>${n.whyNow}</p></div>`;
  h+=`<div class="sec"><h4>Evidence</h4><div class="ev">${n.evidence.map(e=>`<div class="evr"><b>${e[0]}</b><em>${e[2]==='live'?'live':e[2]==='n/a'?'n/a':'updated '+e[2]}</em><span>${e[1]}</span></div>`).join('')}</div></div>`;
  h+=`<div class="sec"><h4>What should happen</h4><p>${n.predicted}</p></div><div class="sec"><h4>What would make this wrong</h4><p>${n.invalid}</p></div>`;
  if(n.alts.length) h+=`<div class="sec"><h4>Options considered</h4><ul class="alts">${n.alts.map(a=>`<li>${a[0]}<span>${a[1]}</span></li>`).join('')}</ul></div>`;
  $('#sbody').innerHTML=h; bindBack();
  const f=$('#sfoot'); f.className='sfoot show';
  if(st) f.innerHTML=`<p class="note">Decision recorded.${st==='approved'?' ShiftWise verifies the result from the source data.':''}</p>`;
  else if(nid==='n5') f.innerHTML=`<div class="btns"><button class="btn primary" id="bA">${n.primary}</button></div>`;
  else {
    f.innerHTML=`<div class="btns"><button class="btn primary" id="bA">${n.primary}</button><button class="btn" id="bB">Not now</button></div>
      <div class="reason" id="rs"><select id="rSel"><option value="">Choose a reason (required)</option><option>Already handled by radio</option><option>Not safe to do now</option><option>Evidence looks wrong</option><option>Other priority on the ground</option></select>
      <textarea id="rNote" placeholder="Add a note (optional)"></textarea><button class="btn" id="bConf" disabled>Record and dismiss</button></div>`;
    $('#bB').addEventListener('click',()=>{$('#rs').classList.add('show');$('#bB').disabled=true;});
    $('#rSel').addEventListener('change',e=>$('#bConf').disabled=!e.target.value);
    $('#bConf').addEventListener('click',()=>decide(nid,'declined'));
  }
  const bA=$('#bA'); if(bA) bA.addEventListener('click',()=>decide(nid,nid==='n2'?'confirming':nid==='n5'?'seen':'approved'));
}

function openDetail(id,doFly){
  if(!INFO[id]) return;
  sideMode='detail'; sideId=id; focusId=id; setRelated([]);
  selRing.scale.setScalar((assets[id].root.userData.r||1.6)*1.3);
  if(assets[id].layer!=='mobile' && id!=='DECLINE' && area!=='all'){ const lv=INFO[id].levels?INFO[id].levels[INFO[id].levels.length-1]:assets[id].level; if(lv!==area) setArea(lv,false); }
  if(doFly) flyTo(worldPos(id),area==='all'?62:44);
  if(CYCLES[id]) setCycle(id);
  renderSide(); renderQueue();
}
function openNBA(nid){
  const n=NBA.find(x=>x.id===nid);
  sideMode='nba'; sideId=nid; focusId=n.focus; setRelated(n.related);
  selRing.scale.setScalar((assets[n.focus].root.userData.r||1.6)*1.3);
  if(n.wide){ setArea('all',false); flyTo(HOME_T,HOME_S.radius,0,HOME_S.phi); }
  else { setArea(assets[n.focus].level,false); flyTo(worldPos(n.focus),46); }
  if(CYCLES[n.focus]) setCycle(n.focus);
  renderSide(); renderQueue();
}
function closeDetail(){ sideMode='area'; sideId=null; focusId=null; setRelated([]); renderSide(); renderQueue(); }
addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea,select')) return;
  if(e.key==='Escape') closeDetail();
  if(e.key==='q'||e.key==='Q') flyTo(controls.target,undefined,Math.PI/4);
  if(e.key==='e'||e.key==='E') flyTo(controls.target,undefined,-Math.PI/4);
  if(e.key==='+'||e.key==='=') zoom(.72);
  if(e.key==='-'||e.key==='_') zoom(1.38);
});

function decide(nid,st){
  const n=NBA.find(x=>x.id===nid); state[nid]=st;
  if(st==='approved'){
    shift.chance=Math.min(97,shift.chance+n.lift);
    if(nid==='n1'){ shift.ore=4120;
      ['TK-03','TK-05'].forEach((id,k)=>{ const a=assets[id]; a.path=polyline(ORE_PATH); a.offset=36+k*52; a.ore=true; a.model.userData.load.material.color.set(0x8f7a63);
        INFO[id].text='Moved to S-212 ore haulage. Hauling ore to the crusher.'; INFO[id].pill='Hauling ore'; INFO[id].rows=[['Load','Ore, S-212 to CR-1'],['Approved at','13:07']]; });
      INFO['CR-1'].text='Two more trucks on ore haulage. The ROM buffer is expected to recover to more than 3 h by 16:30.'; }
    if(nid==='n4'){ shift.dev=12.0; const h=INFO['L1880N']; h.st='ok'; h.pill='Crew booked for 15:10'; h.checks[0]=['ok','People','Charge crew moves over at 15:10 (approved)'];
      assets['L1880N'].root.userData.ring.visible=false; labels.find(l=>l.id==='L1880N').el.querySelector('.dot').className='dot ok';
      CYCLES['L1880N'].steps[2]=['Charge','15:10 booked','now']; CYCLES['L1880N'].next='Next: charge-up at 15:10 · approved · Owner: shift boss'; renderCycle(); }
    toast(`Approved and assigned to ${n.owner}. ShiftWise checks the result from the source data.`);
  } else if(st==='confirming') toast('Field check requested from the services fitter.');
  else if(st==='declined') toast('Recorded as not now, with your reason, in the decision log.');
  else toast('Marked as seen.');
  renderMetrics(); renderSide(); renderQueue();
}
let tT; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tT); tT=setTimeout(()=>t.classList.remove('show'),3200); }

/* Activity cycle tracker */
let cycleId='L1880N';
function setCycle(id){ cycleId=id; renderCycle(); }
function renderCycle(){
  const c=CYCLES[cycleId];
  $('#cycle').innerHTML=`<div class="cyh"><b>Activity cycle</b><span class="chip" style="cursor:pointer" id="cyPlace">${INFO[cycleId].name}</span><span class="nx">${c.next}</span></div>
    <div class="steps">${c.steps.map(s=>`<div class="step ${s[2]}"><i>${s[2]==='done'?'✓':s[2]==='bad'?'!':s[2]==='warn'?'!':s[2]==='now'?'•':''}</i><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div>`;
  $('#cyPlace').addEventListener('click',()=>openDetail(cycleId,true));
}

/* Areas and camera buttons */
function setArea(a,doFly){
  area=a;
  for(const k in groups) groups[k].visible=(a==='all'||k===a);
  shared.visible=(a==='all');
  if(doFly){
    if(a==='all') flyTo(HOME_T,HOME_S.radius,0,HOME_S.phi);
    else if(a==='S') flyTo(new THREE.Vector3(18,0,-22),150,0,.85);
    else flyTo(new THREE.Vector3(0,LV[a],0),78,0,.85);
    if(sideMode!=='area') closeDetail(); else renderSide();
  }
}
function zoom(f){ const d=camera.position.distanceTo(controls.target); flyTo(controls.target,THREE.MathUtils.clamp(d*f,controls.minDistance,controls.maxDistance)); }
$('#zIn').onclick=()=>zoom(.72); $('#zOut').onclick=()=>zoom(1.38);
$('#rL').onclick=()=>flyTo(controls.target,undefined,Math.PI/4);
$('#rR').onclick=()=>flyTo(controls.target,undefined,-Math.PI/4);
$('#home').onclick=()=>setArea('all',true);
let showLabels=true; $('#lblBtn').onclick=()=>{showLabels=!showLabels;$('#lblBtn').classList.toggle('on',showLabels);};

/* Picking and hover */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), tip=$('#tip');
const isShown=o=>{ while(o){ if(!o.visible) return false; o=o.parent; } return true; };
function pick(e){
  const r=renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  for(const h of ray.intersectObjects(pickables.filter(isShown),true)){
    if(h.object.geometry&&h.object.geometry.type==='RingGeometry') continue;
    let o=h.object; while(o&&!o.userData.id) o=o.parent; if(o&&INFO[o.userData.id]) return o.userData.id;
  }
  return null;
}
let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});
renderer.domElement.addEventListener('pointerup',e=>{ if(!down) return; const m=Math.hypot(e.clientX-down.x,e.clientY-down.y); down=null; if(m>5) return; const id=pick(e); if(id) openDetail(id,true); });
renderer.domElement.addEventListener('dblclick',e=>{ const r=renderer.domElement.getBoundingClientRect(); ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(ndc,camera); const h=ray.intersectObjects(scene.children,true).find(h=>h.object.isMesh&&isShown(h.object)); if(h) flyTo(h.point,camera.position.distanceTo(controls.target)*.7); });
let hovT=0;
renderer.domElement.addEventListener('pointermove',e=>{
  if(e.buttons){ tip.style.opacity=0; return; }
  const now=performance.now(); if(now-hovT<40) return; hovT=now;
  const id=pick(e); renderer.domElement.style.cursor=id?'pointer':'grab';
  if(id){ const inf=INFO[id]; tip.innerHTML=`<b>${inf.name}</b>${inf.pill}`; tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+14)+'px'; tip.style.opacity=1; }
  else tip.style.opacity=0;
});
renderer.domElement.addEventListener('pointerleave',()=>tip.style.opacity=0);

/* ═════════ Loop ═════════ */
const clock=new THREE.Clock();
let listTick=0;
function frame(){
  const t=clock.getElapsedTime(), now=performance.now();
  for(const a of movers){
    const L=a.path.len; let s, back=false;
    if(a.loop){ s=(t*a.speed+a.offset)%L; }
    else { const D=a.dwell*a.speed, cyc=2*L+2*D, u=(t*a.speed+a.offset)%cyc;
      if(u<D) s=0; else if(u<D+L) s=u-D; else if(u<2*D+L) s=L; else s=L-(u-2*D-L);
      back=u>=D+L;
      if(a.ore!==undefined && a.model.userData.load) a.model.userData.load.visible=a.ore?back:!back; }
    const {p,dir}=sampleAt(a.path,s);
    a.root.position.copy(p); a.root.lookAt(p.clone().add(back?dir.clone().negate():dir));
    a.level=levelOf(p.y);
  }
  for(const id in assets){ const a=assets[id]; if(a.layer==='mobile') a.root.visible=(area==='all'||a.level===area); }
  for(const id in fanBlades) if(fanBlades[id]) fanBlades[id].rotation.x=t*7;
  const pz=.5+.5*Math.sin(t*3);
  for(const r of pulses){ r.material.opacity=.22+.45*pz; r.scale.setScalar(1+.18*pz); }
  for(const b of beacons) b.m.emissiveIntensity=Math.sin(t*6+b.ph)>.2?2.2:.15;
  for(const p of pins) p.g.position.y=p.base+Math.sin(t*2+p.ph)*.25;
  if(focusId&&assets[focusId]){ const p=worldPos(focusId); selRing.position.set(p.x,p.y+.1,p.z); selRing.material.opacity=.55+.35*pz; selRing.visible=focusId!=='DECLINE'&&isShown(assets[focusId].root); } else selRing.visible=false;
  related.forEach((id,i)=>{ const p=worldPos(id), r=relRings[i]; r.position.set(p.x,p.y+.1,p.z); r.scale.setScalar((assets[id].root.userData.r||1.6)*1.3); r.visible=isShown(assets[id].root); });
  for(const l of labels){
    const a=l.id&&assets[l.id];
    const quiet=a&&a.layer==='mobile'&&INFO[l.id].st!=='bad'&&INFO[l.id].st!=='warn'&&area==='all'&&l.id!==focusId&&!related.includes(l.id);
    l.obj.visible=showLabels&&!quiet&&isShown(l.root);
  }
  if(fly){ const k=Math.min(1,(now-fly.t0)/fly.dur), e=1-Math.pow(1-k,3);
    controls.target.lerpVectors(fly.sT,fly.eT,e);
    const s=new THREE.Spherical(THREE.MathUtils.lerp(fly.s.radius,fly.e.radius,e),THREE.MathUtils.lerp(fly.s.phi,fly.e.phi,e),THREE.MathUtils.lerp(fly.s.theta,fly.e.theta,e));
    camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(s));
    if(k>=1) fly=null; }
  // refresh the fleet list when machines move between areas
  if(sideMode==='area'&&listTab==='fleet'&&now-listTick>1500){ listTick=now; if(areaIds(area,'fleet').join()!==lastListKey) renderArea(); }
  controls.update();
  renderer.render(scene,camera); labelRenderer.render(scene,camera);
  requestAnimationFrame(frame);
}
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight); });
if(innerWidth<900){ camera.position.copy(HOME_T).add(new THREE.Vector3().setFromSpherical(new THREE.Spherical(170,HOME_S.phi,HOME_S.theta))); }

if(window.self!==window.top) $('#brandTitle').textContent='Live view';   // inside the dashboard, which has its own logo
renderMetrics(); renderQueue(); renderSide(); renderCycle();
document.getElementById('loading').remove();
frame();
</script>
